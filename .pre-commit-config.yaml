repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Without these, pre-commit's isolated mypy env sees scipy/numpy/pandas as
        # untyped Any, which silently disagrees with the real project mypy run (e.g.
        # flagging a scipy.sparse type-narrowing ignore as "unused" here while the
        # project env, with real stubs, requires it) — found empirically.
        additional_dependencies:
          - numpy==2.4.6
          - scipy==1.17.1
          - pandas-stubs
        files: ^src/omicsatlas/
