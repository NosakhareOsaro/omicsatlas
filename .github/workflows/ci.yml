name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment/env.yml
          environment-name: omicsatlas
          cache-environment: true
          # Pinned below the sharded-repodata rollout: that experimental libmamba
          # fetch path was silently dropping/mis-parsing some bioconda packages
          # (r-matrixstats, python-annoy) needed transitively by
          # bioconductor-celldex/scran/singler and scrublet, causing solves that
          # succeeded locally to fail in CI — validated empirically while wiring up
          # this workflow.
          micromamba-version: "1.5.10-0"

      - name: Install package (editable, dev extras, pip-resolved R/JAX-bridge deps)
        run: pip install -e ".[dev]" rpy2==3.6.7 pertpy==1.0.3 scikit-learn==1.9.0 pydeseq2==0.5.4

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy

      - name: Pytest (coverage gated in pyproject.toml)
        run: pytest

  r-cmd-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # This job never pushes, so no need to persist checkout credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment/env.yml
          environment-name: omicsatlas
          cache-environment: true
          # See lint-and-test's comment above on this same pin.
          micromamba-version: "1.5.10-0"

      # remotes' bundled fallback GitHub PAT (used for unauthenticated-rate-limit
      # relief) is shared across all remotes users and gets rate-limited/rejected in
      # practice (401 Bad credentials, reproduced on an actual CI run) — passing this
      # workflow's own GITHUB_TOKEN as GITHUB_PAT is the standard fix (also what
      # r-lib/actions itself does for the same reason).
      - name: Install BayesPrism (GitHub-only, pinned commit — see ADR-0004)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'remotes::install_github("Danko-Lab/BayesPrism/BayesPrism@19052052a6f30833b27e2148294459b0ba2f923e")'

      - name: R CMD check (0 errors/warnings/notes required)
        working-directory: r_package/OmicsAtlasBulk
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "note")'

  pkgdown:
    runs-on: ubuntu-latest
    needs: r-cmd-check
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # See r-cmd-check's checkout step above for why persist-credentials is off.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment/env.yml
          environment-name: omicsatlas
          cache-environment: true
          micromamba-version: "1.5.10-0"

      # remotes' bundled fallback GitHub PAT (used for unauthenticated-rate-limit
      # relief) is shared across all remotes users and gets rate-limited/rejected in
      # practice (401 Bad credentials, reproduced on an actual CI run) — passing this
      # workflow's own GITHUB_TOKEN as GITHUB_PAT is the standard fix (also what
      # r-lib/actions itself does for the same reason).
      - name: Install BayesPrism (GitHub-only, pinned commit — see ADR-0004)
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'remotes::install_github("Danko-Lab/BayesPrism/BayesPrism@19052052a6f30833b27e2148294459b0ba2f923e")'

      - name: Install OmicsAtlasBulk
        working-directory: r_package/OmicsAtlasBulk
        run: Rscript -e 'devtools::install(dependencies = FALSE, upgrade = "never")'

      # Validates the pkgdown site builds cleanly. Deployment happens via the
      # unified docs site (Phase 7) — see docs/README.md.
      - name: Build pkgdown site
        working-directory: r_package/OmicsAtlasBulk
        run: Rscript -e 'pkgdown::build_site()'
