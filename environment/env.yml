name: omicsatlas
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  # Core scientific Python stack, needed from Phase 1 (scRNA-seq) onward. R/Bioconductor
  # deps (scran, SingleR, celldex) and the remaining Phase 1 tools (pertpy, scvelo,
  # streamlit) are added in a follow-up commit alongside the CI environment switch.
  # Later phases (spatial, ATAC) add their own deps incrementally in the same way,
  # pinned to the version validated when that phase lands.
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - anndata=0.10.4
  - scanpy=1.10.4
  - leidenalg=0.10.2
  - python-igraph
  - scrublet=0.2.3
  - pip:
      - -e ".[dev]"
