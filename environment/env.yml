name: omicsatlas
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  # Modality-specific dependencies (scanpy, squidpy, scvelo, r-base + Bioconductor
  # packages for the R bridge, snakemake, nextflow, etc.) are added to this file
  # incrementally in the commit that introduces each pipeline phase, pinned to the
  # exact version validated in that phase, rather than speculatively listed here.
  - pip:
      - -e ".[dev]"
