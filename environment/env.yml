name: omicsatlas
channels:
  - conda-forge
  - bioconda
  - defaults
# Apple Silicon note (see ADR-0002): bioconductor-singler has no osx-arm64 conda
# build (only linux-64/osx-64/linux-aarch64 as of this writing). On an Apple Silicon
# Mac, create this environment under Rosetta 2 emulation so the R/Bioconductor
# packages resolve:
#   CONDA_SUBDIR=osx-64 mamba env create -f environment/env.yml
#   conda activate omicsatlas && conda config --env --set subdir osx-64
# CI runs on ubuntu-latest, where every package here has a native linux-64 build, so
# this only affects local dev on Apple Silicon, not CI.
dependencies:
  - python=3.11
  - pip
  # Core scientific Python stack.
  - numpy=2.4.6
  - pandas=2.2.3
  - scipy=1.17.1
  - anndata=0.12.19
  - scanpy=1.10.4
  - leidenalg=0.10.2
  - python-igraph=0.11.9
  - scrublet=0.2.3
  # R / Bioconductor bridge (scran normalisation, SingleR annotation against the
  # celldex HumanPrimaryCellAtlasData reference) — see ADR-0002 for why these stay on
  # the R bridge instead of a Python port.
  - r-base=4.5.3
  - bioconductor-scran=1.38.0
  - bioconductor-singler=2.12.0
  - bioconductor-celldex=1.20.0
  # Remaining Phase 1 tools: Milo (via pertpy, Python-native — see ADR-0002), scVelo
  # (fixture-tested only, not applicable to GSE176078 — see ADR-0002), and the basic
  # UMAP browser.
  - mudata=0.3.10
  - scvelo=0.3.4
  - streamlit=1.60.0
  - pip:
      - -e ".[dev]"
      # rpy2 and pertpy (and its large, fast-moving JAX/equinox/lineax/ott-jax
      # dependency tree, used by pertpy tools other than Milo) resolve to a mutually
      # compatible set far more reliably via pip's resolver than conda-forge's
      # snapshot — validated empirically while building this environment, where the
      # conda-solved combination imported but crashed at runtime on an internal jax
      # API pertpy's transitive deps expected. scikit-learn is pulled in transitively
      # here too, at a newer version than conda alone resolved.
      - rpy2==3.6.7
      - pertpy==1.0.3
      - scikit-learn==1.9.0
