name: omicsatlas
channels:
  - conda-forge
  - bioconda
  - defaults
# Apple Silicon note (see ADR-0002): bioconductor-singler has no osx-arm64 conda
# build (only linux-64/osx-64/linux-aarch64 as of this writing). On an Apple Silicon
# Mac, create this environment under Rosetta 2 emulation so the R/Bioconductor
# packages resolve:
#   CONDA_SUBDIR=osx-64 mamba env create -f environment/env.yml
#   conda activate omicsatlas && conda config --env --set subdir osx-64
# CI runs on ubuntu-latest, where every package here has a native linux-64 build, so
# this only affects local dev on Apple Silicon, not CI.
dependencies:
  - python=3.11
  - pip
  # Core scientific Python stack. Exact versions here matched what the solver
  # actually produced when this environment was last validated locally.
  - numpy=2.4.6
  - pandas=2.2.3
  - scipy=1.17.1
  - anndata=0.12.19
  - scanpy=1.10.4
  - leidenalg=0.10.2
  - python-igraph=0.11.9
  # R / Bioconductor bridge (scran normalisation, SingleR annotation against the
  # celldex HumanPrimaryCellAtlasData reference) — see ADR-0002 for why these stay on
  # the R bridge instead of a Python port. Left unpinned rather than exact-version
  # pinned: bioconda's per-platform channel snapshots don't stay in lockstep, and
  # pinning the exact build resolved on one platform/day broke the solve on another
  # (e.g. macOS osx-64 vs. CI's linux-64) — validated empirically while building this
  # environment. min-version floors below are the versions actually validated.
  - r-base>=4.5
  - bioconductor-scran>=1.38
  - bioconductor-singler>=2.12
  - bioconductor-celldex>=1.20
  - scrublet>=0.2.3
  # Remaining Phase 1 tools: Milo (via pertpy, Python-native — see ADR-0002), scVelo
  # (fixture-tested only, not applicable to GSE176078 — see ADR-0002), and the basic
  # UMAP browser.
  - mudata=0.3.10
  - scvelo>=0.3
  - streamlit=1.60.0
# The Python package itself, plus rpy2/pertpy/scikit-learn, are deliberately NOT
# listed under a `pip:` subsection here — micromamba resolves that subsection's `-e "."`
# relative to this file's directory (environment/), not the repo root, which breaks
# the editable install (validated empirically while wiring up CI). They're installed
# by a separate `pip install` step instead (see Makefile's `setup` target and
# .github/workflows/ci.yml), run from the repo root after this environment is created.
# rpy2 and pertpy (and its large, fast-moving JAX/equinox/lineax/ott-jax dependency
# tree, used by pertpy tools other than Milo) also resolve to a mutually compatible
# set far more reliably via pip's resolver than conda-forge's snapshot — validated
# empirically, where the conda-solved combination imported but crashed at runtime on
# an internal jax API pertpy's transitive deps expected.
